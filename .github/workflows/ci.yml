# Tests every push and pull request; deploys main to the VPS when everything passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Uses an in-memory MongoDB; no secrets needed.
      - run: npm test
      - run: npm run build

  partners:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partners/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test

  # Runs only on main, after all checks pass, and only once the VPS secrets are added in
  # GitHub: Settings, Secrets and variables, Actions (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR).
  deploy:
    needs: [backend, partners, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: echo "ready=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd "${{ secrets.VPS_APP_DIR }}" && bash deploy/update.sh
      - name: Skipped
        if: steps.check.outputs.ready != 'true'
        run: echo "VPS secrets not set yet, skipping deploy."
