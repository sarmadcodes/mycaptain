# api.<your-domain>  →  backend on 127.0.0.1:4000 (REST + Socket.io live updates)
# In CloudPanel: create a "Reverse Proxy" site for api.<your-domain> pointing to http://127.0.0.1:4000,
# issue a Let's Encrypt certificate, then add the WebSocket lines below to its vhost.

location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    # Live updates (Socket.io) need the connection upgraded to a WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace, never append: the API trusts one proxy hop for rate limiting by IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Document uploads are limited to 10 MB by the API.
    client_max_body_size 12m;
}
