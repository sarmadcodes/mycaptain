# mycaptain.threadique.live: one site for everything.
#   /            partner and admin website (Next.js, 127.0.0.1:3710)
#   /backend/    the API for the mobile app (127.0.0.1:4710, prefix removed)
#   /socket.io/  live updates for the app and the website (127.0.0.1:4710)
#
# In CloudPanel: Sites > Add Site > Reverse Proxy, domain mycaptain.threadique.live,
# reverse proxy URL http://127.0.0.1:3710. Issue the Let's Encrypt certificate, then open
# the site's Vhost tab and paste these location blocks inside the HTTPS server { } block,
# above CloudPanel's own "location /" block.

location /backend/ {
    proxy_pass http://127.0.0.1:4710/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace, never append: the API trusts one proxy hop for rate limiting by IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
}

location /socket.io/ {
    proxy_pass http://127.0.0.1:4710;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
}
