# partners.<your-domain>  →  partner website on 127.0.0.1:3010
# In CloudPanel: create a "Reverse Proxy" site for partners.<your-domain> pointing to http://127.0.0.1:3010
# and issue a Let's Encrypt certificate. The settings below match its vhost.

location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
}
